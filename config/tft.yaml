# Cập nhật Teamfight Tactics (ĐTCL): đọc bài patch notes chính thức của Riot,
# tách từng thay đổi tăng/giảm sức mạnh của tướng, tộc hệ, trang bị, lõi, cơ chế…
#
# Xoá file này (hoặc mục `tft`) để tắt tính năng.

tft:
  # Trang danh sách bài patch notes. Đọc theo thứ tự: bài có ở trang đầu (tiếng
  # Việt) được ưu tiên, trang sau chỉ bù các phiên bản trang đầu không có.
  listings:
    - https://teamfighttactics.leagueoflegends.com/vi-vn/news/tags/patch-notes/
    - https://teamfighttactics.leagueoflegends.com/en-us/news/tags/patch-notes/

  # Tên và biểu tượng tướng, tộc hệ, trang bị, lõi (Community Dragon), dùng để
  # biết "Ahri Năng lượng: 0/60 ⇒ 0/50" là thay đổi của tướng Ahri.
  # {locale} được thay bằng ngôn ngữ của bài (vi_vn, en_us…).
  names_url: https://raw.communitydragon.org/latest/cdragon/tft/{locale}.json

  # Từ bản 15.1 (mùa K.O. Đại Chiến Anh Hùng, 2025) số đầu của phiên bản là số mùa.
  # Các bản cũ hơn đánh số theo năm nên không xếp được vào mùa: bỏ qua.
  min_version: "15.1"

  # Số phiên bản giữ lại trên trang web (các mùa cũ hơn bị bỏ dần).
  max_patches: 40

  # Ngôn ngữ của bảng thông số tướng/tộc hệ/trang bị/nâng cấp (Community Dragon).
  db_locale: vi_vn

  # Tên mùa hiện trên web, theo số đầu của phiên bản. Mùa mới không có ở đây thì
  # tên được đoán từ bài đầu mùa (mục "Vật phẩm trang trí <tên mùa>").
  sets:
    "15": "K.O. Đại Chiến Anh Hùng"
    "16": "Truyền Thuyết & Huyền Thoại"
    "17": "Thần Không Gian"
    "18": "Đại Ngàn Kỳ Bí"
