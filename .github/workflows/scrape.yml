name: Lấy giftcode

on:
  schedule:
    # Mỗi giờ vào phút 17 (giờ UTC); GitHub có thể chạy trễ vài phút.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Chẩn đoán: in cấu trúc các trang nguồn ra log (dùng khi một nguồn bị lỗi)"
        type: boolean
        default: false
      inspect_args:
        description: "Chẩn đoán: tham số thêm cho lệnh inspect, vd: --click 'text=\"Nhận\"' --grep giftcode"
        type: string
        default: ""
  push:
    paths:
      - "config/**"
      - "giftcode_finder/**"
      - "site/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: giftcode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only the default branch publishes; runs elsewhere just test and scrape.
      PUBLISH: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
      GCF_WORKFLOW_FILE: scrape.yml
      # Sources with `render: true` use the Chrome that ships with the runner.
      GCF_BROWSER_CHANNEL: chrome
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cài thư viện
        run: |
          pip install -r requirements-dev.txt
          if grep -Eq '^\s*render:\s*true' config/sources.yaml || [ "${{ inputs.debug }}" = "true" ]; then
            pip install playwright
          fi

      - name: Kiểm thử
        run: python -m pytest -q

      # xargs splits the quoted arguments without handing them to a shell.
      - name: Chẩn đoán trang nguồn (HTTP)
        if: inputs.debug
        continue-on-error: true
        env:
          INSPECT_ARGS: ${{ inputs.inspect_args }}
        run: printf '%s' "$INSPECT_ARGS" | xargs python -m giftcode_finder inspect --scan-js --text 200 --html 400

      - name: Chẩn đoán trang nguồn (trình duyệt)
        if: inputs.debug
        continue-on-error: true
        env:
          INSPECT_ARGS: ${{ inputs.inspect_args }}
        run: printf '%s' "$INSPECT_ARGS" | xargs python -m giftcode_finder inspect --render --text 200

      - name: Lấy giftcode
        id: scrape
        env:
          # Optional: Gzone session token, lets the zoneplay source read event codes.
          ZONEPLAY_ACCESS_TOKEN: ${{ secrets.ZONEPLAY_ACCESS_TOKEN }}
        run: python -m giftcode_finder run ${{ inputs.debug && '--debug' || '' }}

      - name: Lưu thay đổi vào repo
        if: env.PUBLISH == 'true'
        run: |
          git add data README.md
          if git diff --cached --quiet; then
            echo "Danh sách code không đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cập nhật giftcode (${{ steps.scrape.outputs.new_codes }} code mới)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Kiểm tra GitHub Pages
        id: pages
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Chưa bật GitHub Pages::Vào Settings → Pages, mục Source chọn 'GitHub Actions' để có trang web xem code. Code vẫn được cập nhật trong README."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: scrape
    if: needs.scrape.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
