<!doctype html>
<html lang="vi">
<head>

  <meta property="og:title" content="GiftCode Finder">

<body>
  <!-- The 3D backdrop: a glowing sky, a moving grid floor and floating wireframes (fx.js). -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="floor"><div class="grid"></div></div>
    <div class="horizon"></div>
    <div class="shapes"></div>
  </div>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" aria-label="GiftCode Finder - trang chủ">
        <span class="logo" aria-hidden="true">
          <span class="logo-cube"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="brand-text">GiftCode<b>Finder</b></span>
      </a>
      <nav class="nav" aria-label="Mục chính">
        <a class="nav-link" href="#/" data-nav="home"><span class="nav-ico" aria-hidden="true">🎁</span><span>Giftcode</span></a>
        <a class="nav-link" href="#/tft" data-nav="tft"><span class="nav-ico" aria-hidden="true">⚔️</span><span>Cập nhật TFT</span></a>
      </nav>
      <p class="topmeta" id="meta">Đang tải…</p>
    </div>
  </header>

  <main class="wrap" id="view">
    <noscript><p class="empty">Trang cần JavaScript để hiện code. Bảng code cũng có trong README của repo.</p></noscript>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script id="gcf-data" type="application/json">__GCF_DATA__</script>
  <script src="fx.js?v=__GCF_VERSION__"></script>
  <script src="tft.js?v=__GCF_VERSION__"></script>
  <script src="app.js?v=__GCF_VERSION__"></script>
